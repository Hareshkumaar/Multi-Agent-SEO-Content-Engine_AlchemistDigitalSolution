{% macro ring(value, size=150) %}
<div class="ring" style="--pct: {{ value or 0 }}; width: {{ size }}px; height: {{ size }}px">
  <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}"><circle class="ring__bg" cx="50" cy="50" r="45"/><circle class="ring__fg" cx="50" cy="50" r="45"/></svg>
  <span class="ring__num">{{ value if value is not none else "-" }}</span>
</div>
{% endmacro %}
